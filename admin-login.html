<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Aesus Asset Reclaim</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="ui.js" defer></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .admin-login-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #1e40af 50%, #3b82f6 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        .admin-login-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
            pointer-events: none;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }

        .login-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 3rem 2rem;
            text-align: center;
            color: white;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .login-header p {
            margin: 0;
            opacity: 0.95;
            font-size: 1rem;
        }

        .login-form-section {
            padding: 2.5rem;
            background: #ffffff !important;
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 2;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #1f2937 !important;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem !important;
            border: 2px solid #d1d5db !important;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #ffffff !important;
            background-color: #ffffff !important;
            color: #111827 !important;
            font-family: inherit;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            position: relative;
            z-index: 1;
            box-sizing: border-box;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        input.form-input {
            background: #ffffff !important;
            background-color: #ffffff !important;
        }
        
        .form-input::placeholder {
            color: #9ca3af !important;
            opacity: 1 !important;
        }

        .form-input:focus {
            outline: none !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1) !important;
            transform: translateY(-2px);
            background: #ffffff !important;
            color: #1f2937 !important;
        }

        .input-wrapper {
            position: relative;
            z-index: 3;
            background: transparent !important;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            pointer-events: none;
            transition: color 0.3s;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        
        .input-icon svg {
            width: 20px !important;
            height: 20px !important;
            color: inherit !important;
            stroke: currentColor !important;
            fill: none !important;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        .input-icon svg path,
        .input-icon svg circle,
        .input-icon svg rect,
        .input-icon svg line {
            stroke: currentColor !important;
            stroke-width: 2 !important;
            fill: none !important;
        }

        .form-input:focus ~ .input-icon {
            color: #3b82f6;
        }
        
        .form-input:focus ~ .input-icon svg {
            color: #3b82f6 !important;
        }

        .btn-login {
            width: 100%;
            padding: 1.125rem 2rem;
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .btn-login:hover::after {
            width: 300px;
            height: 300px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(30, 64, 175, 0.45);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(220, 38, 38, 0.1);
            color: #dc2626;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            border: 2px solid rgba(220, 38, 38, 0.2);
            display: none;
            animation: fadeInUp 0.3s ease;
        }

        .error-message.show {
            display: block;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .login-container {
                max-width: 100%;
            }
            
            .login-header {
                padding: 2rem 1.5rem;
            }
            
            .login-header h1 {
                font-size: 1.75rem;
            }
            
            .login-form-section {
                padding: 2rem 1.5rem;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <script src="icons.js" defer></script>
    <script src="terms-acceptance.js" defer></script>
    <script src="siteConfig.js" defer></script>
</head>
<body>
    <div class="admin-login-page">
        <div class="login-container">
            <div class="login-header">
                <h1><span data-icon="lock" style="display: inline-block; width: 28px; height: 28px; vertical-align: middle; margin-right: 0.5rem;"></span>Admin Access</h1>
                <p data-company-name>Aesus Asset Reclaim Dashboard</p>
            </div>
            
            <div class="login-form-section">
                <div id="errorMessage" class="error-message" role="alert" aria-live="polite" aria-atomic="true"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <div class="input-wrapper">
                            <input 
                                type="email" 
                                id="loginEmail" 
                                name="email"
                                class="form-input" 
                                placeholder="admin@capitalreclaim.com"
                                value="admin@capitalreclaim.com"
                                required
                                autocomplete="username"
                                style="background: #ffffff !important; background-color: #ffffff !important; color: #111827 !important; border: 2px solid #d1d5db !important; display: block !important; visibility: visible !important; opacity: 1 !important;"
                            >
                            <span class="input-icon" data-icon="email"></span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="loginPassword" 
                                name="password"
                                class="form-input" 
                                placeholder="Enter your password"
                                required
                                autocomplete="current-password"
                                style="background: #ffffff !important; background-color: #ffffff !important; color: #111827 !important; border: 2px solid #d1d5db !important; display: block !important; visibility: visible !important; opacity: 1 !important;"
                            >
                            <span class="input-icon" data-icon="lock"></span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-login" id="loginBtn">
                        <span class="btn-content">
                            <span>Sign In</span>
                        </span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        let isSubmitting = false;
        
        // Check if already logged in
        const token = localStorage.getItem('adminToken');
        if (token) {
            // Verify token is still valid
            fetch('https://aesus-investigator-backend.herokuapp.com/api/admin/cases', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    // Token is valid, redirect to dashboard
                    window.location.href = 'admin-dashboard.html';
                } else {
                    // Token invalid, clear it
                    localStorage.removeItem('adminToken');
                }
            })
            .catch(() => {
                localStorage.removeItem('adminToken');
            });
        }
        
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Debounce to prevent double-activation
            if (loginForm.getAttribute('aria-busy') === 'true' || isSubmitting) {
                return;
            }
            isSubmitting = true;
            loginForm.setAttribute('aria-busy','true');
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // Hide error
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            
            // Disable button and show loading
            loginBtn.disabled = true;
            const btnContent = loginBtn.querySelector('.btn-content');
            btnContent.innerHTML = '<span class="spinner"></span> <span>Signing in...</span>';
            
            try {
                const response = await fetch('https://aesus-investigator-backend.herokuapp.com/api/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                // Parse response
                let data;
                try {
                    data = await response.json();
                } catch (parseError) {
                    throw new Error(`Invalid server response. Status: ${response.status}`);
                }
                
                console.log('Login response:', data);
                
                // Check if response is ok
                if (!response.ok) {
                    const errorMsg = data.error || data.message || `Login failed: ${response.status} ${response.statusText}`;
                    throw new Error(errorMsg);
                }
                
                // Check for success response (backend returns { success: true, token })
                if (data.success && data.token) {
                    // Store token
                    localStorage.setItem('adminToken', data.token);
                    
                    // Show success briefly
                    btnContent.innerHTML = '<span>✓ Success!</span>';
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 500);
                } else if (data.token) {
                    // Fallback: if token exists even without success flag
                    localStorage.setItem('adminToken', data.token);
                    btnContent.innerHTML = '<span>✓ Success!</span>';
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 500);
                } else {
                    // Show error from server
                    const errorMsg = data.error || data.message || 'Invalid email or password. Please try again.';
                    errorMessage.textContent = errorMsg;
                    errorMessage.classList.add('show');
                    
                    // Re-enable button
                    loginBtn.disabled = false;
                    btnContent.innerHTML = '<span>Sign In</span>';
                }
            } catch (error) {
                console.error('Login error:', error);
                
                // Determine error message
                let errorMsg = 'Connection error. Please check your internet connection and try again.';
                if (error.message) {
                    errorMsg = error.message;
                } else if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMsg = 'Cannot connect to server. Please make sure the server is running on https://aesus-investigator-backend.herokuapp.com';
                }
                
                errorMessage.textContent = errorMsg;
                errorMessage.classList.add('show');
                
                // Re-enable button
                loginBtn.disabled = false;
                btnContent.innerHTML = '<span>Sign In</span>';
            } finally {
                // Clear busy state and debounce flag
                isSubmitting = false;
                loginForm.removeAttribute('aria-busy');
            }
        });
        
        // Initialize icons when page loads
        function initializeIcons() {
            if (window.initAllIcons) {
                window.initAllIcons();
                console.log('[Admin Login] Icons initialized');
            } else {
                // If icons.js hasn't loaded yet, try again after a short delay
                setTimeout(initializeIcons, 100);
            }
        }
        
        // Wait for DOM and scripts to be ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(initializeIcons, 200);
            });
        } else {
            setTimeout(initializeIcons, 200);
        }
        
        // Auto-focus email field
        setTimeout(function() {
            document.getElementById('loginEmail').focus();
        }, 300);
    </script>
</body>
</html>
